name: Empire Maps daily long video (5-6 min)

on:
  # Test phase: started by hand only. After the owner approves the test video the daily schedule is added
  # (16:35 Malaysia time, just after the YouTube quota resets). Uploads are private and go public by themselves
  # at PUBLISH_UTC (16:30 UTC = 00:30 Malaysia, evening in Europe, afternoon in the US).
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional empire id from topics.json (empty = next one without a long video)"
        required: false
        default: ""
      upload:
        description: "Upload to YouTube (off = test only, the preview goes to the qa-long branch)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: empire-maps-long
  cancel-in-progress: false

jobs:
  make-long:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: Asia/Kuala_Lumpur
      FFMPEG_PATH: ffmpeg
      PYTHON: python
      YT_CATEGORY: "27"
      BRAND: "EMPIRE MAPS"
      PUBLISH_UTC: "16:30"
      GEMINI_TEXT_MODEL: gemini-3.8-flash
      GEMINI_TTS_MODEL: gemini-3.8-flash-tts
      LONG_VOICE: Charon
      LONG_VOICE_CHUNKS: "3"
      WHISPER_MODEL: base.en
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pillow numpy faster-whisper==1.1.1
      - name: Reuse the speech model between runs
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base-en-v1
      - name: Keep the border maps between runs
        uses: actions/cache@v4
        with:
          path: data
          key: borders-v1
      - name: Make the long video
        env:
          TOPIC: ${{ inputs.topic }}
          DO_UPLOAD: ${{ github.event_name == 'schedule' || inputs.upload }}
        run: |
          set --
          if [ -n "$TOPIC" ]; then set -- "$@" --topic "$TOPIC"; fi
          if [ "$DO_UPLOAD" != "true" ]; then set -- "$@" --no-upload; fi
          node long/make-long.js "$@" 2>&1 | tee long.log
          exit ${PIPESTATUS[0]}
      - name: Save long-video history
        if: success()
        run: |
          [ -f long-history.json ] || exit 0
          git config user.name "empire-maps-bot"
          git config user.email "empire-maps-bot@users.noreply.github.com"
          git add long-history.json
          git commit -m "Long video history $(date +'%Y-%m-%d %H:%M')" || exit 0
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
      - name: Save a preview for checking (qa-long branch)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          D=$(ls -d output/long-*/ 2>/dev/null | tail -1)
          mkdir -p /tmp/qa
          cp long.log /tmp/qa/ 2>/dev/null || true
          if [ -n "$D" ]; then cp "$D/preview.mp4" "$D/thumb.jpg" "$D/script.json" "$D/meta.json" "$D/long.json" /tmp/qa/ 2>/dev/null || true; fi
          cd /tmp/qa
          git init -q -b qa-long
          git add .
          git -c user.name=empire-maps-bot -c user.email=empire-maps-bot@users.noreply.github.com commit -qm "long preview $(date +'%Y-%m-%d %H:%M')"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" qa-long || echo "could not save preview"
      - name: Keep the full video for 3 days (download from this run page)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: empire-maps-long-${{ github.run_number }}
          path: |
            output/long-*/final.mp4
            output/long-*/thumb.jpg
            long.log
          retention-days: 3
          if-no-files-found: ignore
